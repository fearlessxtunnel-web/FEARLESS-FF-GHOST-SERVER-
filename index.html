<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEARLESS GHOST SERVER</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#fff;font-family:Arial}
.card{width:min(90%,420px);padding:28px;border-radius:20px;background:#171717;text-align:center}
input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:10px;border:0;font-size:16px}
button{cursor:pointer;font-weight:bold;background:#e50914;color:#fff}
#result{margin-top:18px;min-height:24px}
</style>
</head>
<body>
<main class="card">
<h1>FEARLESS</h1>
<p>GHOST SERVER KEY</p>
<input id="key" placeholder="Enter your key">
<button onclick="validateKey()">VALIDATE KEY</button>
<div id="result"></div>
</main>
<script>
async function validateKey(){
 const key=document.getElementById("key").value.trim();
 const result=document.getElementById("result");
 if(!key){result.textContent="Enter a key.";return;}
 result.textContent="Checking...";
 try{
  const r=await fetch("/api/validate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({key})
  });
  const d=await r.json();
  result.textContent=d.valid
   ? "VALID KEY — Expires: "+d.expiresAt
   : "INVALID KEY — "+(d.error||"");
 }catch(e){result.textContent="Server error."}
}
</script>
</body>
</html>
