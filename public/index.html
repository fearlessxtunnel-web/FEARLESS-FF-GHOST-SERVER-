<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#09050f" />
  <meta name="description" content="FEARLESS Ghost Server Activation Key Center" />

  <title>FEARLESS — Ghost Server</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #07040d;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
      position: relative;
    }

    /* =========================
       BACKGROUND
    ========================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(130, 0, 255, .18), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(220, 0, 255, .10), transparent 35%),
        radial-gradient(circle at 90% 70%, rgba(90, 0, 255, .10), transparent 35%),
        #07040d;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      animation: float 10s ease-in-out infinite;
    }

    .orb.one {
      width: 280px;
      height: 280px;
      background: #7000ff;
      top: -100px;
      left: -100px;
    }

    .orb.two {
      width: 260px;
      height: 260px;
      background: #d000ff;
      right: -100px;
      bottom: -80px;
      animation-delay: -4s;
    }

    .orb.three {
      width: 180px;
      height: 180px;
      background: #3600ff;
      top: 45%;
      left: 45%;
      opacity: .16;
      animation-delay: -7s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(20px, -25px, 0) scale(1.08);
      }
    }

    /* =========================
       CARD
    ========================== */

    .app {
      position: relative;
      z-index: 2;
      width: min(100%, 520px);
    }

    .card {
      position: relative;
      border: 1px solid rgba(190, 110, 255, .28);
      border-radius: 32px;
      padding: 30px 24px 24px;
      background:
        linear-gradient(
          145deg,
          rgba(27, 19, 39, .94),
          rgba(10, 7, 17, .96)
        );
      box-shadow:
        0 30px 90px rgba(0, 0, 0, .55),
        0 0 80px rgba(120, 0, 255, .13),
        inset 0 1px 0 rgba(255, 255, 255, .05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #a900ff,
        #ffffff,
        #a900ff,
        transparent
      );
      opacity: .7;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #8a00ff;
      filter: blur(120px);
      opacity: .07;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* =========================
       HEADER
    ========================== */

    .status {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(190, 100, 255, .25);
      border-radius: 999px;
      background: rgba(100, 0, 180, .09);
      color: #cfa4ff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a800ff;
      box-shadow: 0 0 12px #a800ff;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .45;
        transform: scale(.72);
      }
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 35% 25%, #c94cff, #6500d9 48%, #27005b);
      border: 1px solid rgba(255, 255, 255, .18);
      box-shadow:
        0 0 25px rgba(147, 0, 255, .75),
        0 0 65px rgba(147, 0, 255, .35),
        inset 0 0 25px rgba(255, 255, 255, .10);
      animation: logoGlow 3s ease-in-out infinite;
    }

    .logo span {
      font-size: 48px;
      filter: drop-shadow(0 0 8px rgba(255,255,255,.65));
    }

    @keyframes logoGlow {
      0%, 100% {
        box-shadow:
          0 0 25px rgba(147, 0, 255, .75),
          0 0 65px rgba(147, 0, 255, .35);
      }

      50% {
        box-shadow:
          0 0 35px rgba(174, 0, 255, .95),
          0 0 85px rgba(174, 0, 255, .42);
      }
    }

    .eyebrow {
      text-align: center;
      color: #c18aff;
      font-family: "Space Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 9px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(48px, 15vw, 74px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(
        180deg,
        #ffffff 5%,
        #f2dfff 52%,
        #c783ff 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(190, 80, 255, .35));
    }

    .subtitle {
      text-align: center;
      margin-top: 14px;
      color: #aaa0b4;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* =========================
       KEY BOX
    ========================== */

    .key-section {
      margin-top: 30px;
    }

    .key-box {
      min-height: 70px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(211, 173, 235, .25);
      background: rgba(0, 0, 0, .32);
      box-shadow:
        inset 0 0 25px rgba(140, 0, 255, .035),
        0 8px 30px rgba(0, 0, 0, .20);
    }

    .key-value {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #f7efff;
      font-family: "Space Mono", monospace;
      font-size: clamp(12px, 3.3vw, 17px);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .placeholder {
      color: #625a67;
      letter-spacing: 3px;
    }

    .copy-btn {
      border: 0;
      border-radius: 15px;
      min-width: 92px;
      height: 52px;
      padding: 0 16px;
      background: linear-gradient(135deg, #25192e, #38203f);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .copy-btn:active {
      transform: scale(.96);
    }

    .copy-btn:hover {
      background: linear-gradient(135deg, #38203f, #54255f);
    }

    /* =========================
       GENERATE BUTTON
    ========================== */

    .generate-btn {
      position: relative;
      width: 100%;
      height: 66px;
      margin-top: 18px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(
        110deg,
        #7200ff,
        #a600ff,
        #df25ff
      );
      background-size: 200% 100%;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 12px 35px rgba(137, 0, 255, .35),
        inset 0 1px 0 rgba(255,255,255,.20);
      transition: transform .2s ease, box-shadow .2s ease;
      animation: gradientMove 4s linear infinite;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .generate-btn::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      left: -80px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
      );
      transform: skewX(-20deg);
      animation: shine 3.5s infinite;
    }

    @keyframes shine {
      0% {
        left: -80px;
      }

      35%, 100% {
        left: 120%;
      }
    }

    .generate-btn:active {
      transform: scale(.985);
      box-shadow:
        0 7px 22px rgba(137, 0, 255, .3);
    }

    .generate-btn.loading {
      pointer-events: none;
      opacity: .75;
    }

    /* =========================
       INFO
    ========================== */

    .status-message {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: #958c9d;
      font-size: 12px;
      line-height: 1.5;
    }

    .status-message.success {
      color: #d4a6ff;
    }

    .status-message.error {
      color: #ff809b;
    }

    .timer {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: #b88aff;
      font-family: "Space Mono", monospace;
      font-size: 11px;
      font-weight: 700;
    }

    .timer.visible {
      display: flex;
    }

    .timer strong {
      color: #fff;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #615969;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer .secure {
      color: #806d8b;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 420px) {
      body {
        padding: 15px 10px;
      }

      .card {
        padding: 26px 17px 20px;
        border-radius: 27px;
      }

      .logo {
        width: 96px;
        height: 96px;
      }

      .logo span {
        font-size: 40px;
      }

      .key-box {
        padding-left: 14px;
      }

      .copy-btn {
        min-width: 78px;
        height: 48px;
        padding: 0 10px;
      }

      .generate-btn {
        height: 62px;
      }

      .footer {
        flex-direction: column;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <main class="app">
    <section class="card">

      <div class="status">
        <div class="status-pill">
          <span class="status-dot"></span>
          Ghost Server Online
        </div>
      </div>

      <div class="logo-wrap">
        <div class="logo" aria-label="FEARLESS">
          <span>☠</span>
        </div>
      </div>

      <div class="eyebrow">
        FE GHOST SERVER
      </div>

      <h1>FEARLESS</h1>

      <div class="subtitle">
        Activation Key Center
      </div>

      <div class="key-section">

        <div class="key-box">
          <div id="key"
               class="key-value placeholder">
            • • • • • • • • • • • • • • •
          </div>

          <button
            id="copyBtn"
            class="copy-btn"
            type="button"
            onclick="copyKey()">
            COPY
          </button>
        </div>

        <button
          id="generateBtn"
          class="generate-btn"
          type="button"
          onclick="generateKey()">
          GENERATE KEY
        </button>

        <div id="status"
             class="status-message">
          Generate your activation key to continue.
        </div>

        <div id="timer"
             class="timer">
          KEY EXPIRES IN
          <strong id="countdown">39:00</strong>
        </div>

      </div>

      <footer class="footer">
        <span>© 2026 FEARLESS TEAM</span>
        <span class="secure">SECURE • 39 MIN TTL</span>
      </footer>

    </section>
  </main>

  <script>
    const keyElement = document.getElementById("key");
    const statusElement = document.getElementById("status");
    const timerElement = document.getElementById("timer");
    const countdownElement = document.getElementById("countdown");
    const generateButton = document.getElementById("generateBtn");
    const copyButton = document.getElementById("copyBtn");

    let currentKey = "";
    let countdownInterval = null;

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = "status-message";

      if (type) {
        statusElement.classList.add(type);
      }
    }

    function setLoading(loading) {
      generateButton.classList.toggle("loading", loading);

      if (loading) {
        generateButton.textContent = "GENERATING...";
      } else {
        generateButton.textContent = "GENERATE KEY";
      }
    }

    function startCountdown(seconds) {
      clearInterval(countdownInterval);

      let remaining = Number(seconds);

      if (!Number.isFinite(remaining) || remaining <= 0) {
        remaining = 39 * 60;
      }

      timerElement.classList.add("visible");

      function update() {
        const minutes = Math.floor(remaining / 60);
        const secondsLeft = remaining % 60;

        countdownElement.textContent =
          String(minutes).padStart(2, "0") +
          ":" +
          String(secondsLeft).padStart(2, "0");

        if (remaining <= 0) {
          clearInterval(countdownInterval);

          currentKey = "";

          keyElement.textContent =
            "• • • • • • • • • • • • • • •";

          keyElement.classList.add("placeholder");

          timerElement.classList.remove("visible");

          setStatus("Key expired. Generate a new key.", "error");
          return;
        }

        remaining--;
      }

      update();
      countdownInterval = setInterval(update, 1000);
    }

    async function generateKey() {
      setLoading(true);
      setStatus("Connecting to FEARLESS Ghost Server...");

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        /*
         * Read text first instead of immediately calling response.json().
         * This prevents the "Unexpected token A" error when Vercel sends
         * a plain-text error page.
         */
        const rawText = await response.text();

        let data;

        try {
          data = JSON.parse(rawText);
        } catch (jsonError) {
          console.error("NON_JSON_SERVER_RESPONSE:", rawText);

          throw new Error(
            "Server returned a non-JSON response (" +
            response.status +
            "). Check the /api/generate deployment."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            ("Server returned HTTP " + response.status)
          );
        }

        if (!data.ok || !data.key) {
          throw new Error(
            data.error || "The server did not return a key."
          );
        }

        currentKey = data.key;

        keyElement.textContent = currentKey;
        keyElement.classList.remove("placeholder");

        copyButton.textContent = "COPY";

        setStatus(
          "Activation key generated successfully.",
          "success"
        );

        startCountdown(
          Number(data.expiresIn) || (39 * 60)
        );

      } catch (error) {
        console.error("GENERATE_ERROR:", error);

        setStatus(
          error.message || "Unable to generate key.",
          "error"
        );

      } finally {
        setLoading(false);
      }
    }

    async function copyKey() {
      if (!currentKey) {
        setStatus(
          "Generate a key before copying it.",
          "error"
        );
        return;
      }

      try {
        await navigator.clipboard.writeText(currentKey);

        copyButton.textContent = "COPIED";

        setStatus(
          "Key copied to clipboard.",
          "success"
        );

        setTimeout(() => {
          copyButton.textContent = "COPY";
        }, 1600);

      } catch (error) {
        /*
         * Fallback for browsers where Clipboard API isn't available.
         */
        const textarea = document.createElement("textarea");

        textarea.value = currentKey;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);
        textarea.select();

        try {
          document.execCommand("copy");

          copyButton.textContent = "COPIED";

          setStatus(
            "Key copied to clipboard.",
            "success"
          );

          setTimeout(() => {
            copyButton.textContent = "COPY";
          }, 1600);

        } catch {
          setStatus(
            "Copy failed. Please copy the key manually.",
            "error"
          );
        }

        textarea.remove();
      }
    }
  </script>

</body>
</html>
