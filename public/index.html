<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08000d">
<title>FEARLESS — Activation Key Center</title>
<style>
:root{--bg:#050007;--card:rgba(19,10,28,.8);--line:#4a2a58;--p:#7b13ff;--q:#d32cff;--muted:#aaa0b0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:#fff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 8%,#381050 0,transparent 35%),radial-gradient(circle at 85% 90%,#19002b 0,transparent 40%),var(--bg)}.card{width:min(520px,100%);padding:32px 24px 28px;text-align:center;border:1px solid var(--line);border-radius:28px;background:var(--card);backdrop-filter:blur(18px);box-shadow:0 0 70px #8c20ff22}.logo{width:92px;height:92px;margin:auto;display:grid;place-items:center;border-radius:50%;font-size:38px;background:linear-gradient(145deg,#6900ff,#bd2cff);box-shadow:0 0 34px #a828ff99}.eyebrow{margin-top:18px;color:#c58aff;font-size:12px;font-weight:800;letter-spacing:4px}h1{margin:7px 0 2px;font-size:48px;letter-spacing:5px;text-shadow:0 0 24px #d359ff88}.sub{color:var(--muted);letter-spacing:3px;font-size:13px}.keybox{display:flex;align-items:center;gap:8px;margin-top:28px;padding:7px 8px 7px 18px;border:1px solid #44354e;border-radius:17px;background:#08070b}#key{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left;font:600 16px ui-monospace,monospace}.copy{padding:10px 16px;border:0;border-radius:13px;background:#211728;color:#fff;font-weight:800}.generate{width:100%;margin-top:15px;padding:17px;border:0;border-radius:16px;background:linear-gradient(100deg,var(--p),var(--q));color:#fff;font-size:16px;font-weight:900;letter-spacing:2px;box-shadow:0 12px 30px #8914ff47}.status{min-height:24px;margin:17px 0 4px;color:#b7aabd;font-size:14px}.timer{font:700 13px ui-monospace,monospace;color:#d99cff}.footer{margin-top:26px;color:#6e6473;font-size:12px}@media(max-width:430px){h1{font-size:40px}}
</style></head>
<body><section class="card"><div class="logo">☠</div><div class="eyebrow">FE GHOST SERVER</div><h1>FEARLESS</h1><div class="sub">ACTIVATION KEY CENTER</div><div class="keybox"><div id="key">••••••••••••••••••</div><button class="copy" id="copy">COPY</button></div><button class="generate" id="generate">GENERATE KEY</button><div class="status" id="status">Generate your activation key to continue.</div><div class="timer" id="timer"></div><div class="footer">© 2026 FEARLESS TEAM</div></section>
<script>
const keyEl=document.getElementById('key'),statusEl=document.getElementById('status'),timerEl=document.getElementById('timer');
document.getElementById('generate').onclick=async()=>{statusEl.textContent='Generating secure key…';timerEl.textContent='';try{const r=await fetch('/api/generate',{method:'POST'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Generation failed');keyEl.textContent=d.key;try{await navigator.clipboard.writeText(d.key)}catch{}statusEl.textContent='Key copied to clipboard.';timer(d.expiresIn)}catch(e){statusEl.textContent=e.message||'Unable to generate key.'}};
document.getElementById('copy').onclick=async()=>{const k=keyEl.textContent.trim();if(!k||k.startsWith('•')){statusEl.textContent='Generate a key first.';return}try{await navigator.clipboard.writeText(k);statusEl.textContent='Key copied to clipboard.'}catch{statusEl.textContent='Copy failed.'}};
function timer(s){let n=Number(s);const tick=()=>{if(n<=0){timerEl.textContent='EXPIRED';statusEl.textContent='This activation key has expired.';return}timerEl.textContent=`EXPIRES IN ${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;n--;setTimeout(tick,1000)};tick()}
</script></body></html>
